 
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videozvonok v3</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      position: relative;
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000000;
    }

    #local-video {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 105px;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      background: #111;
      z-index: 15;
      transform: scaleX(-1);
      display: none;
    }
    #local-video.back-cam {
      transform: scaleX(1);
    }

    #controls {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 85%;
      max-width: 320px;
      z-index: 20;
    }
    .start-btn {
      padding: 16px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }
    .start-btn.call-btn {
      background: #10b981;
    }
    .start-btn:active { opacity: 0.85; }

    #call-bar {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      gap: 18px;
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 12px 22px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 30;
      transition: opacity 0.3s ease;
    }
    #call-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .ctrl-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn.muted {
      background: #ffffff;
      color: #111111;
    }
    .ctrl-btn.end-btn {
      background: #ef4444;
      color: #ffffff;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #ffffff;
      background: rgba(37, 99, 235, 0.85);
      padding: 8px 16px;
      border-radius: 20px;
      text-align: center;
      z-index: 25;
      max-width: 90%;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="btn-wait" class="start-btn">1. Zhdat zvonok (Otkryt pervym)</button>
    <button id="btn-call" class="start-btn call-btn">2. Pozvonit (Otkryt vtorym)</button>
  </div>

  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video" autoplay playsinline muted></video>

  <div id="call-bar">
    <button id="btn-mic" class="ctrl-btn">Mic</button>
    <button id="btn-cam" class="ctrl-btn">Cam</button>
    <button id="btn-end" class="ctrl-btn end-btn">End</button>
  </div>

  <div id="status">Gotov k rabote (v3)</div>

  <script>
    const ROOM_ID = 'cherry837-mc-001-zvonok-9941';

    const remoteVideo = document.getElementById('remote-video');
    const localVideo = document.getElementById('local-video');
    const controls = document.getElementById('controls');
    const status = document.getElementById('status');
    const callBar = document.getElementById('call-bar');
    const btnMic = document.getElementById('btn-mic');

    let myStream = null;
    let currentCall = null;
    let currentPeer = null;
    let currentFacing = 'user';
    let isMicMuted = false;
    let hideTimer = null;

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    document.getElementById('btn-wait').addEventListener('click', () => joinCall('wait'));
    document.getElementById('btn-call').addEventListener('click', () => joinCall('call'));
    document.getElementById('btn-mic').addEventListener('click', toggleMic);
    document.getElementById('btn-cam').addEventListener('click', switchCamera);
    document.getElementById('btn-end').addEventListener('click', endCall);

    async function joinCall(mode) {
      controls.style.display = 'none';
      status.innerText = '1/3 Zapros kamery i mikrofona...';

      if (typeof Peer === 'undefined') {
        status.innerText = 'Oshibka: biblioteka PeerJS ne zagruzilas';
        return;
      }

      try {
        myStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing },
          audio: { echoCancellation: true, noiseSuppression: true }
        });

        localVideo.srcObject = myStream;
        localVideo.style.display = 'block';
        callBar.style.display = 'flex';
        showCallBar();
        keepScreenAwake();

        status.innerText = '2/3 Podklyuchenie k serveru...';

        if (mode === 'wait') {
          currentPeer = new Peer(ROOM_ID, peerConfig);

          currentPeer.on('open', () => {
            status.innerText = '3/3 Ozhidanie vtorogo ustroystva...';
          });

          currentPeer.on('call', (call) => {
            status.innerText = 'Vkhodyashchiy zvonok...';
            currentCall = call;
            call.answer(myStream);
            handleStream(call);
          });

          currentPeer.on('error', (err) => {
            status.style.display = 'block';
            status.innerText = 'Oshibka servera: ' + err.type;
          });

        } else {
          currentPeer = new Peer(peerConfig);

          currentPeer.on('open', () => {
            status.innerText = '3/3 Zvonim na pervoe ustroystvo...';
            currentCall = currentPeer.call(ROOM_ID, myStream);
            handleStream(currentCall);
          });

          currentPeer.on('error', (err) => {
            status.style.display = 'block';
            status.innerText = 'Oshibka zvonka: ' + err.type;
          });
        }
      } catch (err) {
        status.innerText = 'Net dostupa k kamere: ' + err.message;
        controls.style.display = 'flex';
      }
    }

    function handleStream(call) {
      call.on('stream', (remoteStream) => {
        remoteVideo.srcObject = remoteStream;
        remoteVideo.play().catch(() => {
          status.style.display = 'block';
          status.innerText = 'Tapni po ekranu dlya zvuka';
        });
        status.style.display = 'none';
      });

      call.on('close', () => {
        endCall();
      });
    }

    function toggleMic() {
      if (!myStream) return;
      const audioTrack = myStream.getAudioTracks().at(0);
      if (audioTrack) {
        isMicMuted = !isMicMuted;
        audioTrack.enabled = !isMicMuted;
        btnMic.innerText = isMicMuted ? 'Off' : 'Mic';
        btnMic.classList.toggle('muted', isMicMuted);
      }
      showCallBar();
    }

    async function switchCamera() {
      if (!myStream) return;
      currentFacing = (currentFacing === 'user') ? 'environment' : 'user';
      
      myStream.getVideoTracks().forEach(track => track.stop());

      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacing },
          audio: false
        });
        const newVideoTrack = newStream.getVideoTracks().at(0);

        const oldVideoTrack = myStream.getVideoTracks().at(0);
        if (oldVideoTrack) myStream.removeTrack(oldVideoTrack);
        if (newVideoTrack) myStream.addTrack(newVideoTrack);
        
        localVideo.srcObject = myStream;
        localVideo.classList.toggle('back-cam', currentFacing === 'environment');

        if (currentCall && currentCall.peerConnection && newVideoTrack) {
          const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) {
            sender.replaceTrack(newVideoTrack);
          }
        }
      } catch (err) {
        status.style.display = 'block';
        status.innerText = 'Ne udalos pereklyuchit kameru';
        setTimeout(() => { status.style.display = 'none'; }, 2000);
      }
      showCallBar();
    }

    function endCall() {
      if (myStream) {
        myStream.getTracks().forEach(track => track.stop());
      }
      if (currentCall) currentCall.close();
      if (currentPeer) currentPeer.destroy();
      location.reload();
    }

    function showCallBar() {
      if (callBar.style.display === 'none') return;
      callBar.classList.remove('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        callBar.classList.add('hidden');
      }, 4000);
    }

    async function keepScreenAwake() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    document.body.addEventListener('click', (e) => {
      if (remoteVideo.srcObject && remoteVideo.paused) {
        remoteVideo.play();
        status.style.display = 'none';
      }
      if (e.target.tagName !== 'BUTTON') {
        showCallBar();
      }
    });

    document.body.addEventListener('dblclick', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      toggleFullScreen();
    });

    let lastTap = 0;
    document.body.addEventListener('touchend', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      const currentTime = new Date().getTime();
      if (currentTime - lastTap < 300 && currentTime - lastTap > 0) {
        e.preventDefault();
        toggleFullScreen();
      }
      lastTap = currentTime;
    });
  </script>

</body>
</html>
